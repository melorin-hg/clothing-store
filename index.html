<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>clothing store</title>
</head>
<body>
    <header>
        <img src="images/logo.png" alt="logo" id="logo-img">
        <nav id="header-nav">
            <ul>
                <li><a href="#">خانه</a></li>
                <li><a href="#">مدیریت حساب</a></li>
                <li><a href="#">...</a></li>
            </ul>
        </nav>
        <div id="icons-container">
            <button id="headerSearch-btn" href="#search-btn"><svg class="icons" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></button>
            <button id="shoppingCart-btn"><svg class="icons" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart preview-icon"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg></button>
        </div>
    </header>
    <section id="slider-box"><div id="slider-container">

    </div></section>

    <div class="hero-container">
        <aside>
            <div class="search-container">                
                <button id="search-btn"><svg class="icons" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></button>
                <input type="text" id="search-inputbox"> 
            </div>
            <div class="category-container">
                <img src="images/women.png" alt="women" id="women">
                <img src="images/children.png" alt="children" id="children">
                <img src="images/men.png" alt="men" id="men">
            </div>
        </aside>
        <div>
            <div class="Product-container"></div>
            <div class="ProductDivider-container"></div>
        </div>
    </div>

    <footer>
        <nav id="footer-nav">
            <ul>
                <li><a href="#">در باره ی ما</a></li>
                <li><a href="#">ارتباط با ما</a></li>
            </ul>
        </nav>
        <div id="footerLogo-container">
            <img src="images/logo.png" alt="logo">
        </div>
    </footer>
    <script src="app.js"></script>
    <script src="slider.js"></script>
</body>
</html>
